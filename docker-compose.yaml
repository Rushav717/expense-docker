networks:
  expense: {} #expense network will be created with bridge driver
volumes:
  mysql:
services:
  mysql:  #docker run -d --name mysql --network expense -v mysql:/var/lib/mysql mysql:1.0.0
    image: mysql:1.0.0
    container_name: mysql
    networks:
      - expense
    volumes:
      - mysql:/var/lib/mysql
  backend:
    image: backend:1.0.0
    container_name: backend
    networks:
      - expense
    depends_on:
      - mysql
  frontend:
    image: frontend:1.0.0
    container_name: frontend
    networks:
      - expense
    ports:
      - 80:80
    depends_on:
      - backend
